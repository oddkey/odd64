# Code loads at the normal BASIC start and stops before the second
# screen at $3800. That screen must stay free of code: the game draws
# into it. Sprite pictures are linked at $3C00. The tail holds the
# tables, sound, bombs, the score screens, and the title picture,
# through $7EA0. The map follows. The help text is copied to $E000.
# The C stack is at $D000 and grows down toward the map.
FEATURES {
    STARTADDRESS: default = $0801;
}
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $0800;
    __HIMEM__:     type = weak, value = $D000;
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002, size = $001A;
    LOADADDR: file = %O,               start = %S - 2, size = $0002;
    HEADER:   file = %O, define = yes, start = %S, size = $000D;
    MAIN:     file = %O, define = yes, fill = yes, start = __HEADER_LAST__, size = $3800 - __HEADER_LAST__;
    SCREEN:   file = %O, fill = yes, start = $3800, size = $0400;
    HIGH:     file = %O, fill = yes, start = $3C00, size = $0140;
    TAIL:     file = %O, fill = yes, start = $3D40, size = $7EA0 - $3D40;
    BSS:      file = "", start = $7EA0, size = $D000 - $7EA0;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro;
    LOWCODE:  load = MAIN,     type = ro, optional = yes;
    INIT:     load = MAIN,     type = ro;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = TAIL,     type = ro;
    DATA:     load = TAIL,     type = rw;
    ONCE:     load = TAIL,     type = ro, define = yes;
    CHASE:    load = TAIL,     type = ro;
    SOUND:    load = TAIL,     type = ro;
    BOMB:     load = TAIL,     type = ro;
    FOE:      load = TAIL,     type = ro;
    SPRITES:  load = HIGH,     type = ro, start = $3C00;
    HELP:     load = SCREEN,   type = ro, start = $3800;
    BSS:      load = BSS,      type = bss, define = yes;
}
FEATURES {
    CONDES: type = constructor,
            label = __CONSTRUCTOR_TABLE__,
            count = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type = destructor,
            label = __DESTRUCTOR_TABLE__,
            count = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type = interruptor,
            label = __INTERRUPTOR_TABLE__,
            count = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import = __CALLIRQ__;
}
