# Code stays below VIC bank 1. The hires bitmap, its color matrix and
# the sprites live in that bank. The ROM font is copied to $7000 at run
# time, above the variables and below the stack.
FEATURES {
    STARTADDRESS: default = $0801;
}
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $0400;
    __HIMEM__:     type = weak, value = $8000;
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002,           size = $001A;
    LOADADDR: file = %O,               start = %S - 2,          size = $0002;
    HEADER:   file = %O, define = yes, start = %S,              size = $000D;
    MAIN:     file = %O, define = yes, fill = yes, start = __HEADER_LAST__, size = $4000 - __HEADER_LAST__;
    BITMAP:   file = %O, define = yes, fill = yes, start = $4000, size = $2000;
    SCREEN:   file = %O, define = yes, start = $6000, size = $0400;
    SPRITES:  file = %O, define = yes, fill = yes, start = $6400, size = $0140;
    BSS:      file = "",               start = $6800,           size = $0800;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro;
    LOWCODE:  load = MAIN,     type = ro, optional = yes;
    INIT:     load = MAIN,     type = ro;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    ONCE:     load = MAIN,     type = ro, define = yes;
    BITMAP:   load = BITMAP,   type = rw;
    SCREEN:   load = SCREEN,   type = rw;
    SPRITES:  load = SPRITES,  type = ro;
    BSS:      load = BSS,      type = bss, define = yes;
}
FEATURES {
    CONDES: type = constructor,
            label = __CONSTRUCTOR_TABLE__,
            count = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type = destructor,
            label = __DESTRUCTOR_TABLE__,
            count = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type = interruptor,
            label = __INTERRUPTOR_TABLE__,
            count = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import = __CALLIRQ__;
}
